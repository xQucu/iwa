<div class="max-w-5xl mx-auto px-4 py-8 flex flex-col gap-8">
  <header class="flex justify-between items-center py-6 border-b border-gray-200">
    <div class="text-xl font-extrabold text-gray-900 tracking-tight">Student Grades</div>
    <a routerLink="" class="inline-flex items-center justify-center px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-800 text-sm font-semibold rounded-lg transition-colors">Back to Subjects</a>
  </header>

  <main class="w-full">
    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
      <h2 class="text-xl font-bold text-gray-900 mb-6">My Grades</h2>

      @if (errorMessage()) {
      <div class="p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200 mb-4">{{ errorMessage() }}</div>
      }

      <div class="w-full overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 text-left">
          <thead>
            <tr class="border-b border-gray-200">
              <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Subject</th>
              <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Grade</th>
              <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Description</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            @for (grade of grades(); track grade.id) {
            <tr class="hover:bg-gray-50/50">
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-950"><strong>{{ grade.subject.name }}</strong></td>
              <td class="px-6 py-4 whitespace-nowrap text-sm">
                <span class="px-2 py-0.5 text-xs font-bold rounded bg-gray-100 text-gray-800 border border-gray-200">{{ grade.value }}</span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ grade.description || 'No description' }}</td>
            </tr>
            } @empty {
            <tr>
              <td colspan="3" class="px-6 py-8 text-center text-sm text-gray-500 italic">No grades assigned yet.</td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
